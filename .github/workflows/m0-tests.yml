name: M0 tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      LOCUS_REQUIRE_MCP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install official SDK and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check installation and syntax
        run: |
          python -m pip check
          python -m compileall -q src
      - name: Run core, IPC, and mandatory SDK subprocess integration tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Run reproducible two-client MCP smoke test
        run: python -m locus.demo
      - name: Upload test result (no credentials or fixtures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-test-results-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore
